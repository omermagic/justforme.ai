<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palavra Quest reminder</title>
  <link rel="stylesheet" href="reminder.css">
</head>
<body>
  <main class="card">
    <div class="flag" aria-hidden="true"><span></span></div>
    <p class="eyebrow">PALAVRA QUEST</p>
    <h1>Three minutes<br>of Portuguese?</h1>
    <p class="message">A tiny mission today keeps the words alive tomorrow.</p>
    <div class="streak"><strong>3</strong><span>minutes<br>is enough</span></div>
    <button class="start" id="startQuest">Start today’s quest <span>→</span></button>
    <button class="later" id="dismiss">Not now</button>
  </main>
  <script src="reminder.js"></script>
</body>
</html>
