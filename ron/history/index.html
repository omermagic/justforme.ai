'use strict';
const QUESTIONS=[{"id":"Q001","topic":"origens","q":"Onde se localizava o núcleo principal do mundo grego antigo?","choices":["No sul da Península Balcânica e nas ilhas e costas vizinhas.","Na Península Ibérica e na Gália.","Apenas no norte da Europa.","Exclusivamente no vale do Nilo."],"correct":0,"why":"A civilização grega desenvolveu-se no sul balcânico, nas ilhas do Egeu e Jónico e na costa da Ásia Menor.","level":1},{"id":"Q002","topic":"origens","q":"Como chamavam os Gregos ao território que consideravam a sua pátria cultural?","choices":["Hélade.","Império Romano.","Mesopotâmia.","Fenícia."],"correct":0,"why":"Hélade designava o mundo dos Helenos, unido por elementos culturais.","level":1},{"id":"Q003","topic":"origens","q":"Como se designavam a si próprios os Gregos?","choices":["Helenos.","Romanos.","Persas.","Faraós."],"correct":0,"why":"«Helenos» é a autodesignação grega; «Grécia» é um nome de origem romana.","level":1},{"id":"Q004","topic":"origens","q":"Qual era a origem do nome «Grécia» usado atualmente?","choices":["Romana.","Egípcia.","Fenícia.","Persa."],"correct":0,"why":"Segundo o manual, «Grécia» é uma designação de origem romana.","level":2},{"id":"Q005","topic":"origens","q":"O que unia culturalmente as comunidades gregas?","choices":["Língua, religião, cultura e costumes.","Um único rei e um único parlamento.","A mesma moeda obrigatória em todas as pólis.","Um mesmo calendário político em todas as cidades."],"correct":0,"why":"A unidade cultural dos Helenos não significava unidade política entre todas as cidades-Estado.","level":2},{"id":"Q006","topic":"origens","q":"O relevo montanhoso da Grécia teve que consequência principal?","choices":["Dificultou as comunicações e favoreceu pólis independentes.","Permitiu a unificação rápida num Estado único.","Impossibilitou a navegação marítima.","Eliminou qualquer atividade agrícola."],"correct":0,"why":"As montanhas isolavam regiões e ajudaram a formar pequenas comunidades autónomas.","level":2,"source":"g"},{"id":"Q007","topic":"origens","q":"O que significa «Grécia insular»?","choices":["A parte grega formada por ilhas.","O território grego nas margens do Nilo.","As cidades no interior da Ásia.","A região montanhosa da Macedónia."],"correct":0,"why":"«Insular» refere-se às ilhas, por exemplo muitas das ilhas do mar Egeu.","level":1},{"id":"Q008","topic":"origens","q":"A Grécia oriental situava-se principalmente...","choices":["Na costa da Ásia Menor.","No norte da Escandinávia.","No vale do rio Nilo.","Na península Itálica."],"correct":0,"why":"Os Gregos estabeleceram comunidades na costa da atual Turquia, chamada Ásia Menor.","level":2},{"id":"Q009","topic":"origens","q":"Que mar separa a Grécia continental de grande parte da costa ocidental da Ásia Menor?","choices":["Mar Egeu.","Mar do Norte.","Mar Báltico.","Mar Vermelho."],"correct":0,"why":"O mar Egeu banha a Grécia e a Ásia Menor.","level":1},{"id":"Q010","topic":"origens","q":"Qual das opções descreve corretamente uma pólis?","choices":["Uma cidade-Estado independente com instituições e leis próprias.","Uma aldeia sempre governada por Atenas.","Um bairro sem governo próprio.","Uma província do Império Romano."],"correct":0,"why":"A pólis era uma comunidade politicamente independente, com núcleo urbano e território envolvente.","level":1},{"id":"Q011","topic":"origens","q":"O território de uma cidade-Estado podia incluir...","choices":["Um núcleo urbano e áreas rurais circundantes.","Apenas o templo principal.","Somente uma ilha desabitada.","Todo o Mediterrâneo, necessariamente."],"correct":0,"why":"A pólis incluía a cidade e a sua área rural; por vezes abrangia outros núcleos urbanos.","level":2},{"id":"Q012","topic":"origens","q":"Que conjunto de elementos podia ser próprio de cada pólis?","choices":["Leis, governo, moeda e calendário.","Uma constituição única para todas as pólis.","Um presidente eleito por todos os Helenos.","Um único templo comum a todo o Mediterrâneo."],"correct":0,"why":"A autonomia das pólis abrangia governo, leis, moeda, unidades de medida e calendário.","level":2},{"id":"Q013","topic":"origens","q":"Atenas e Esparta eram...","choices":["Duas cidades-Estado gregas.","Dois bairros de uma mesma cidade.","Dois rios da Grécia.","Dois imperadores romanos."],"correct":0,"why":"Atenas e Esparta eram pólis distintas, embora ambas pertencentes ao mundo grego.","level":1},{"id":"Q014","topic":"origens","q":"Qual afirmação explica como os Gregos podiam ser culturalmente unidos, mas politicamente separados?","choices":["Partilhavam cultura, mas cada pólis tinha autonomia.","Falavam idiomas diferentes em cada família.","Todas as cidades obedeciam a um faraó.","Não existiam relações entre as cidades."],"correct":0,"why":"Identidade cultural comum não é o mesmo que um Estado político unificado.","level":3},{"id":"Q015","topic":"origens","q":"Na geografia grega, a Ática é a região onde se situa...","choices":["Atenas.","Roma.","Alexandria.","Cartago."],"correct":0,"why":"Atenas situava-se na Ática.","level":2},{"id":"Q016","topic":"origens","q":"Que região do sul da Grécia se associa a Esparta?","choices":["Peloponeso.","Gália.","Sicília.","Península Ibérica."],"correct":0,"why":"Esparta localizava-se no Peloponeso.","level":2},{"id":"Q017","topic":"origens","q":"Se um mapa distingue Grécia continental, insular e oriental, está a classificar...","choices":["Três áreas geográficas do mundo grego.","Três períodos da história romana.","Três classes sociais de Atenas.","Três instituições políticas atenienses."],"correct":0,"why":"É uma divisão espacial: continente, ilhas e costas orientais.","level":2},{"id":"Q018","topic":"origens","q":"Segundo a fonte, qual a relação entre o relevo e a organização política?","choices":["O isolamento geográfico ajudou a formar pólis autónomas.","As montanhas obrigaram à criação de um império central.","O relevo eliminou as diferenças entre cidades.","A proximidade dos montes impediu qualquer comunidade."],"correct":0,"why" lo refere a suspensão das rivalidades bélicas durante os Jogos.","level":2,"source":"o"},{"id":"Q248","topic":"legado","q":"Que conjunto reúne modalidades mencionadas nos Jogos Olímpicos antigos?","choices":["Luta, corrida, saltos, lançamento do disco e corridas de carros.","Fórmula 1, surf elétrico e hóquei no gelo.","Basquetebol, snowboard e ténis de mesa.","E-sports, karting e paraquedismo."],"correct":0,"why":"O manual apresenta atletismo, luta, saltos, discos e carros e cavalos, entre outras modalidades.","level":2,"source":"o"},{"id":"Q249","topic":"legado","q":"Qual destas modalidades estava associada aos carros puxados por cavalos?","choices":["Corrida de carros.","Lançamento do disco.","Oratória.","Tragédia."],"correct":0,"why":"As corridas de carros eram uma modalidade dos Jogos antigos.","level":2},{"id":"Q250","topic":"legado","q":"O que demonstra comparar a luta greco-romana atual com a luta da Grécia antiga?","choices":["Uma continuidade desportiva com diferenças de regras e contexto.","Que os Jogos antigos e modernos são completamente idênticos.","Que não havia competições de luta na Antiguidade.","Que a luta só surgiu no século XXI."],"correct":0,"why":"O método comparativo permite reconhecer semelhanças e diferenças entre passado e presente.","level":3,"source":"x"},{"id":"Q251","topic":"legado","q":"Qual é uma diferença de objetivos entre os Jogos antigos e os atuais?","choices":["Os antigos prestavam culto a Zeus; os atuais reúnem desportistas de muitos países.","Os Jogos atuais são organizados obrigatoriamente em Olímpia para Zeus.","Os antigos tinham apenas provas digitais.","Os antigos nunca reuniam participantes de mais de uma pólis."],"correct":0,"why":"A dimensão religiosa e pan-helénica antiga distingue-se da escala internacional atual.","level":3,"source":"o"},{"id":"Q252","topic":"legado","q":"Na fonte de Tucídides, por que é importante comparar vários testemunhos?","choices":["Porque as testemunhas do mesmo acontecimento podem apresentar nienses eram escravos."],"why":"Ler fontes criticamente significa reconhecer o seu contexto e possíveis preconceitos; não implica concordar com o autor.","level":3,"source":"s","correct":0},{"id":"Q257","topic":"origens","q":"Onde ficava Olímpia, um importante santuário grego mencionado no mapa do manual?","choices":["No Peloponeso.","Na Península Ibérica.","No Egito.","No norte da Gália."],"why":"Olímpia ficava no Peloponeso e tornou-se célebre pelos Jogos Olímpicos.","level":2,"correct":0},{"id":"Q258","topic":"origens","q":"Qual par de lugares pertence à Grécia insular, isto é, formada por ilhas?","choices":["Creta e Rodes.","Atenas e Esparta.","Delfos e Corinto.","Tessália e Ática."],"why":"Creta e Rodes são ilhas; os outros pares referem regiões ou cidades do continente.","level":2,"correct":0},{"id":"Q259","topic":"artes","q":"Segundo o texto sobre o teatro e Dioniso, as primeiras festas incluíam...","choices":["Cortejos com máscaras e celebrações relacionadas com a terra e a fertilidade.","Eleições por voto eletrónico.","Jogos de futebol em estádios modernos.","Reuniões do Senado romano."],"why":"O texto do manual relaciona o desenvolvimento do teatro com cortejos religiosos, máscaras e rituais de fertilidade.","level":2,"source":"r","correct":0}];
const TOPICS=[{"id":"origens","name":"Origem e espaço grego","icon":"🗺️","color":"#3d8cba","pages":"48, 50","he":"יוון הייתה מורכבת מערי־מדינה עצמאיות בגלל ההרים, אבל היוונים חלקו שפה, דת ומנהגים.","intro":"O mundo grego, a Hélade e a formação das pólis.","facts":["Os Gregos habitavam o sul da Península Balcânica, ilhas do mar Egeu e do mar Jónico e zonas costeiras da Ásia Menor.","Chamavam ao seu mundo Hélade e a si próprios Helenos; partilhavam língua, religião, cultura, usos e costumes.","O nome «Grécia» é de origem romana.","O relevo montanhoso dificultava as comunicações e favoreceu a formação de comunidades independentes: as pólis.","Grécia continental = território do continente; insular = ilhas; oriental = costas da Ásia Menor.","Uma pólis tinha governo, leis, moeda, calendário e divindade protetora próprios, além de núcleo urbano e território rural.","A pólis não era apenas uma cidade: era um Estado independente."]},{"id":"tempo","name":"Datas e protagonistas","icon":"⏳","color":"#ad78bc","pages":"49","he":"בציר הזמן לפנה״ס השנה הגדולה יותר מוקדמת יותר. קלייסתנס 507, פריקלס 461, פרתנון 447.","intro":"Cronologia e figuras fundamentais do século V a. C.","facts":["776 a. C.: primeiros Jogos Olímpicos (data convencional).","750/700 a. C.: aparecimento das pólis e difusão do alfabeto.","594 a. C.: reformas políticas e sociais de Sólon.","Século VI a. C.: filosofia na Ásia Menor e aparecimento do teatro.","507 a. C.: reformas políticas de Clístenes.","461 a. C.: início do governo de Péricles em Atenas.","451 a. C.: lei da cidadania sob Péricles.","447 a. C.: início da construção do Pártenon.","Clístenes relaciona-se com a implantação da democracia; Péricles, com a sua consolidação; Heródoto, com a História."]},{"id":"politica","name":"Democracia e instituições","icon":"🏛️","color":"#527fc5","pages":"50–52","he":"אקלסיה = אספת כל האזרחים; בולה = מועצת 500; הליאיה = בית המשפט של 6,000 שופטים בהגרלה; מיסטוס = תשלום להשתתפות.","intro":"Como funcionava a democracia direta de Atenas.","facts":["Clístenes promoveu reformas políticas em 507 a. C. (final do século VI a. C.), ajudando a criar as bases da democracia ateniense.","Péricles consolidou a democracia ateniense.","Democracia direta: cidadãos participavam diretamente nas decisões políticas (sem eleger representantes para decidir tudo por eles).","Eclésia: assembleia dos cidadãos; discutia e aprovava leis, elegia governantes e decidia a paz e a guerra.","Bulé: conselho de 500 cidadãos que preparava os trabalhos da Eclésia.","Helieia ou Tribunal Popular: 6000 juízes escolhidos por sorteio.","Misthós: remuneração que ajudava os cidadãos a participar na política sem perder os seus rendimentos.","Ostracismo: afastamento temporário de um cidadão, até 10 anos, para proteger o regime; podia limitar a participação."]},{"id":"sociedade","name":"Cidadãos e exclusões","icon":"⚖️","color":"#ca755a","pages":"52–53","he":"רק גברים חופשיים בני יותר מ־18 לאב ולאם אתונאים נחשבו אזרחים בעלי זכויות פוליטיות. נשים, מטויקים ועבדים לא השתתפו.","intro":"Quem participava, quem ficava de fora e porquê.","facts":["No livro, cidadão ateniense = homem livre, maior de 18 anos, filho de pai e mãe atenienses.","Mulheres: sem direitos políticos; funções familiares e, conforme a condição social, trabalho fora de casa.","Metecos: estrangeiros livres residentes na pólis, sobretudo ligados ao comércio e artesanato; sem direitos políticos.","Os metecos tinham deveres, como o serviço militar; excecionalmente podiam receber cidadania.","Escravos: pessoas sem liberdade, consideradas propriedade de outros, sem direitos civis ou políticos.","Alguns escravos eram prisioneiros de guerra; outros nasciam de pais escravizados.","A igualdade ateniense aplicava-se aos cidadãos, não a toda a população.","O discurso de Péricles sobre o interesse de todos deve ser lido no contexto de uma cidadania restrita."]},{"id":"economia","name":"Economia de Atenas","icon":"🪙","color":"#c5913a","pages":"52–53","he":"אתונה התפרנסה מחקלאות, מלאכה ומסחר. פיראוס היה הנמל הראשי, והדרכמה מטבע שחסך צורך בסחר חליפין.","intro":"Agricultura, artesanato, comércio, porto do Pireu e moeda.","facts":["A economia ateniense assentava na agricultura, no artesanato e no comércio.","O Pireu era o principal porto de entrada e saída de produtos.","Atenas tornou-se um centro comercial importante no Mediterrâneo.","Dracma: moeda usada nas transações comerciais.","Economia comercial e monetária: riqueza baseada em trocas comerciais com uso de moeda.","A moeda facilitou as trocas e o transporte de valor, evitando transportar grandes quantidades de mercadorias.","Nas moedas atenienses apareciam Atena e uma coruja; por vezes também ramos de oliveira.","No século V a. C., a pólis ateniense alcançou o seu apogeu."]},{"id":"artes","name":"Arte, arquitetura e teatro","icon":"🎭","color":"#8a6ac0","pages":"54–55","he":"אמנות קלאסית חיפשה הרמוניה, איזון, סדר ויופי. עמוד דורי פשוט, יוני עם סלסולים, קורינתי עם עלים. תיאטרון לכבוד דיוניסוס.","intro":"Teatro, ordens arquitetónicas, templos e valores da arte clássica.","facts":["A arte grega valorizava harmonia, equilíbrio, ordem, perfeição e o ser humano (humanismo).","O teatro estava ligado ao culto de Dioniso e tinha caráter religioso, cívico e educativo.","Tragédia: destino humano e deuses, desfecho geralmente trágico; comédia: crítica social e política por meio do riso.","As representações ocorriam em teatros ao ar livre, com bancadas semicirculares.","Ésquilo, Sófocles e Eurípides destacaram-se na tragédia; Aristófanes, na comédia.","Acrópole: parte alta da cidade, associada a templos e edifícios importantes; ágora: espaço público de encontro e comércio.","Os templos gregos eram geralmente retangulares, sustentados por colunas.","Ordem dórica = capitel simples; jónica = volutas (espirais); coríntia = folhas decorativas.","O Pártenon, na acrópole de Atenas, é um templo com colunas de ordem dórica.","O mármore era muito utilizado; edifícios e esculturas eram pintados com cores fortes e contrastantes."]},{"id":"plasticas","name":"Escultura e cerâmica","icon":"🏺","color":"#be7b65","pages":"56–57","he":"הפסלים הראו בני אדם ואלים בצורה טבעית; פסלי שיש רבים הם העתקים רומיים של יציקות ברונזה. על הכדים תיארו מיתוסים, ספורט וחיי יום־יום.","intro":"Naturalismo, escultores, vasos pintados e leitura de imagens.","facts":["A escultura clássica representava o corpo humano com naturalismo, harmonia e proporção.","Escultores destacados: Fídias, Policleto, Míron e Praxíteles.","Muitos originais gregos eram de bronze; chegaram até nós numerosas cópias romanas em mármore.","A arte arcaica era mais rígida; a clássica procurava movimentos e figuras mais naturais.","Vasos e pratos podiam mostrar deuses, heróis, mitos, festas religiosas, desporto e vida quotidiana.","Cores frequentes na cerâmica: negro, vermelho e vermelho-ocre.","O relevo dos cavaleiros do Pártenon mostra movimento e observação da figura humana.","O vaso com Hércules e a Hidra representa um episódio mitológico.","A Vitória de Samotrácia é uma escultura helenística posterior ao período clássico; serve para comparar expressividade e movimento."]},{"id":"legado","name":"Legado, História e Jogos","icon":"🏅","color":"#299784","pages":"58–61","he":"היוונים השפיעו על דמוקרטיה, פילוסופיה, היסטוריה, רפואה, מתמטיקה, תיאטרון וספורט. משחקים אולימפיים כל 4 שנים באולימפיה לכבוד זאוס.","intro":"Contributos para o presente, método comparativo e Olimpíadas.","facts":["O legado grego está presente na democracia, nas artes, na filosofia, na História, nas ciências e no desporto.","Sócrates, Platão e Aristóteles destacaram-se na filosofia e no pensamento crítico.","Heródoto e Tucídides investigaram e narraram acontecimentos históricos.","Pitágoras destacou-se na matemática; Hipócrates na medicina; Demóstenes na oratória.","Homero está associado à Ilíada e à Odisseia.","Método comparativo: comparar realidades de épocas ou lugares diferentes, identificando semelhanças e diferenças.","Tucídides chamava a atenção para testemunhos contraditórios: o historiador deve verificar e confrontar fontes.","Os primeiros Jogos Olímpicos datam convencionalmente de 776 a. C.; realizavam-se em Olímpia de quatro em quatro anos em honra de Zeus.","Os Jogos tinham dimensão religiosa e pan-helénica: juntavam participantes das várias pólis; os vencedores eram honrados.","Provas antigas: corridas, luta, saltos, lançamento do disco ou dardo, corridas de carros e cavalos.","Hoje, os Jogos reúnem atletas de muitos países; nem todos os aspetos religiosos e sociais são iguais aos antigos."]}];

const SOURCES={"p":{"title":"Fonte histórica · Discurso de Péricles","text":"«Entre nós, o Estado é administrado no interesse de todos e não de uma minoria; por isso, o nosso regime tomou o nome de democracia.» — Péricles, citado por Tucídides (adaptado)."},"t":{"title":"Fonte histórica · Tucídides","text":"«As testemunhas de um mesmo acontecimento prestavam muitas vezes relatos discordantes.» — Tucídides (adaptado)."},"h":{"title":"Fonte histórica · Heródoto","text":"Heródoto procurava registar as ações dos Gregos e dos outros povos para que não fossem esquecidas e investigar as causas dos seus conflitos. — Síntese adaptada da fonte do manual."},"a":{"title":"Fonte histórica · Aristóteles e a pólis","text":"Segundo Aristóteles, a pólis precisava de meios de subsistência, atividades profissionais, armas, recursos para o comércio e a guerra, culto divino e poder de decidir assuntos coletivos. — Síntese adaptada."},"m":{"title":"Fonte histórica · A origem da moeda","text":"«A necessidade das trocas levou a usar um objeto fácil de transportar e de valor reconhecido, em vez de transportar mercadorias a grandes distâncias.» — Ideia de Aristóteles (adaptada)."},"c":{"title":"Fonte histórica · Cidadania","text":"«O cidadão contribui para os assuntos públicos como membro da assembleia popular ou do tribunal. Em tempo de guerra, pega em armas para defender a cidade.» — Ideia apresentada no manual (adaptada)."},"l":{"title":"Fonte histórica · Péricles e a participação","text":"Péricles instituiu o misthós para os cidadãos que precisavam de deixar o trabalho ou deslocar-se para participar nas assembleias atenienses. — Síntese adaptada."},"o":{"title":"Fonte histórica · Jogos Olímpicos","text":"Os Jogos Olímpicos celebravam-se em Olímpia em honra de Zeus. Eram encontros pan-helénicos com competições desportivas e rituais religiosos. — Síntese adaptada."},"r":{"title":"Fonte histórica · O teatro","text":"O teatro grego desenvolveu-se em ligação com festivais religiosos de Dioniso e apresentava tragédias e comédias. — Síntese adaptada."},"x":{"title":"Comparar passado e presente","text":"Na Atenas do século V a. C., as mulheres, os metecos e os escravos estavam excluídos dos direitos políticos. Nas democracias atuais, a cidadania e o sufrágio têm um âmbito geralmente mais amplo. — Quadro de comparação para estudo."},"b":{"title":"Fonte histórica · Economia ateniense","text":"Em Atenas, o porto do Pireu recebia e enviava mercadorias; a dracma servia como meio de pagamento. — Síntese adaptada."},"v":{"title":"Fonte visual · Cultura grega","text":"Os vasos gregos representavam mitos, heróis, cenas do quotidiano e práticas desportivas. — Síntese adaptada."},"g":{"title":"Fonte histórica · Geografia","text":"O relevo montanhoso dificultou os contactos entre comunidades, favorecendo o aparecimento de numerosas pólis independentes. — Síntese adaptada."},"s":{"title":"Fonte histórica · Pseudo-Xenofonte e a escravatura","text":"A fonte do manual apresenta uma justificação antiga da escravatura: os escravos eram considerados inferiores, e a guerra era vista como meio de os obter. É uma visão histórica a analisar criticamente, não uma verdade sobre o valor das pessoas. — Síntese adaptada do manual, p. 53."}};

function save(){try{localStorage.setItem(KEY,JSON.stringify({progress,session,soundOn}))}catch(e){}}
function statsFor(id){const arr=QUESTIONS.filter(q=>q.topic===id).map(q=>progress.q[q.id]).filter(Boolean);let attempts=arr.reduce((a,b)=>a+(b.a||0),0);let correct=arr.reduce((a,b)=>a+(b.c||0),0);let seen=arr.length;return{attempts,correct,seen,accuracy:pct(correct,attempts),size:QUESTIONS.filter(q=>q.topic===id).length};}
function mistakes(){return QUESTIONS.filter(q=>{let r=progress.q[q.id];return r&&r.w>0&&r.streak<2})}
function mastery(){const finished=TOPICS.filter(t=>{let s=statsFor(t.id);return s.seen>=Math.ceil(s.size*.55)&&s.accuracy>=85}).length;const passed=(progress.exams||[]).filter(e=>e.mode==='exam'&&e.grade>=18).length;const coverage=(progress.exams||[]).filter(e=>e.mode==='coverage'&&e.grade>=18).length;return{topics:finished,passed,coverage,ready:finished===8&&passed>=2&&coverage>=1&&mistakes().length===0}}
function logAnswer(q,originalChoice){let x=progress.q[q.id]||{a:0,c:0,w:0,streak:0};x.a++;if(originalChoice===q.correct){x.c++;x.streak++;progress.xp=(progress.xp||0)+10;}else{x.w++;x.streak=0;}x.last=Date.now();progress.q[q.id]=x;save()}
function sound(correct){if(!soundOn)return;try{let c=new (window.AudioContext||window.webkitAudioContext)();let t=c.currentTime;[0,1,2].forEach((i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=correct?(440*Math.pow(2,(i*4)/12)):((i===0)?260:220);g.gain.setValueAtTime(.0001,t+i*.075);g.gain.exponentialRampToValueAtTime(.06,t+i*.075+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.075+.13);o.connect(g).connect(c.destination);o.start(t+i*.075);o.stop(t+i*.075+.15)});setTimeout(()=>c.close(),700)}catch(e){}}

ength?'':'disabled'}>Rever ${mistakes().length} erros</button>${!mistakes().length?'<p class="tiny">Ainda não há erros pendentes. Excelente!</p>':''}</div></div></section>

trong>58/64 ou melhor (≥18/20)</strong> e rever todos os erros.</span></div><button class="btn primary" data-action="start" data-mode="coverage">Verificar cobertura completa →</button></section><section class="mainsec panel"><h3>Histórico de avaliações</h3>${last.length?last.map(e=>`<div class="historyrow"><div style="font-size:23px">${e.grade>=18?'🏆':'📝'}</div><div><strong>${e.mode==='exam'?'Prova completa':e.mode==='coverage'?'Cobertura total':'Diagnóstico'}</strong><small>${new Date(e.when).toLocaleDateString('pt-PT')} · ${e.right}/${e.total} corretas</small></div><span class="historygrade">${e.grade.toFixed(1).replace('.0','')}/20</span></div>`).join(''):'<p>Ainda não fizeste nenhuma prova. Começa quando estiveres preparado!</p>'}</section>`, 'exams')}
function errorsPage(){const errs=mistakes();return frame(`<div class="eyebrow" style="color:#9b7934">REVISÃO INTELIGENTE</div><h1 class="sectiontitle">Transforma erros em pontos</h1><p class="subtitle">Há ${errs.length} pergunta${errs.length===1?'':'s'} por dominar. O objetivo não é decorar: é conseguires responder outra vez sem ajuda.</p>${errs.length?`<div class="panel"><div class="secthead"><h3>Os teus pontos de atenção</h3><button class="btn primary" data-action="start" data-mode="mistakes">Treinar erros →</button></div>${TOPICS.map(t=>{let n=errs.filter(q=>q.topic===t.id).length;return n?`<div class="historyrow"><span class="topicico" style="background:${t.color}18">${t.icon}</span><div style="flex:1"><strong>${esc(t.name)}</strong><small>${n} pergunta${n===1?'':'s'} por reforçar</small></div><button class="btn small outline" data-action="start" data-mode="mistake-topic" data-topic="${t.id}">Rever</button></div>`:''}).join('')}</div>`:`<div class="empty"><span class="emoji">✨</span><h2>Nenhum erro pendente!</h2><p>Continua a praticar e desafia-te com um simulado completo.</p><button class="btn dark" data-action="nav" data-to="exams">Ir às provas →</button></div>`}<div class="dangerzone"><h3 style="margin-top:0">💾 Guardar o teu progresso</h3><p style="font-size:13px;color:var(--muted)">Os resultados ficam guardados neste navegador. Podes exportá-los para um ficheiro e importar noutro dispositivo.</p><div class="btnrow"><button class="btn outline small" data-action="export">⬇ Exportar progresso</button><button class="btn outline small" data-action="import">⬆ Importar progresso</button><button class="btn danger small" data-action="reset">Apagar progresso</button></div><input type="file" id="import-file" accept="application/json,.json" class="hiddeninput"></div>`, 'errors')}
function pickSequence(mode,topic=null){const used=new Set();function choose(pool,amount){let arr=pool.filter(q=>!used.has(q.id));arr=shuffle(arr).map(q=>({q,score:weight(q)})).sort((a,b)=>b.score-a.score).map(x=>x.q);let out=arr.slice(0,amount);out.forEach(q=>used.add(q.id));return out}function weight(q){let p=progress.q[q.id];return (!p?80:0)+(p&&p.w>0&&p.streak<2?100:0)-(p?p.a*5:0)+Math.random()*55+(q.level===3?12:0)}
 if(mode==='coverage'){let selected=[];for(const cp of CHECKPOINTS){let options=cp.ids.map(id=>byId[id]).filter(q=>!used.has(q.id));if(!options.length)options=QUESTIONS.filter(q=>q.topic===cp.topic&&!used.has(q.id));selected.push(...choose(options,1))}return shuffle(selected)}
 if(mode==='exam'||mode==='diagnostic'){let each=mode==='exam'?5:3;let picked=[];for(const t of TOPICS){let pool=QUESTIONS.filter(q=>q.topic===t.id);let selected=[];let preferred=pool.filter(q=>q.source||q.visual);if(preferred.length)selected.push(...choose(preferred,1));selected.push(...choose(pool.filter(q=>q.level===3),1));selected.push(...choose(pool.filter(q=>q.level===2),mode==='exam'?2:1));selected.push(...choose(pool,each-selected.length));picked.push(...selected)}return shuffle(picked)}
 if(mode==='sources'){return choose(QUESTIONS.filter(q=>q.source||q.visual),24)}
 if(mode==='topic'){return choose(QUESTIONS.filter(q=>q.topic===topic),15)}
 if(mode==='mistakes'||mode==='mistake-topic'){return choose(mistakes().filter(q=>mode==='mistakes'||q.topic===topic),Math.min(20,mistakes().filter(q=>mode==='mistakes'||q.topic===topic).length))}
 let all=[];for(const t of TOPICS){all.push(...choose(QUESTIONS.filter(q=>q.topic===t.id),2))}return shuffle(all)}
function begin(mode,topic){const items=pickSequence(mode,topic);if(!items.length){screen='errors';render();return}session={mode,topic:topic||'all',idx:0,steps:items.map(q=>({id:q.id,order:shuffle([0,1,2,3]),answer:-1,flag:false,logged:false})),started:Date.now(),timed:(mode==='exam'&&examTimed),ended:false};finishedOnce=false;screen='quiz';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function gradeOf(s){const right=s.steps.filter(st=>st.answer===0).length;return{right,total:s.steps.length,grade:Math.round((right/s.steps.length)*200)/10,wrong:s.steps.length-right}}
function finish(){if(!session||finishedOnce)return;finishedOnce=true;const s=session;for(const st of s.steps){if(!st.logged){logAnswer(byId[st.id],st.answer);st.logged=true;}}const score=gradeOf(s);lastResult={...score,mode:s.mode,steps:s.steps.map(st=>({...st})),duration:Math.round((Date.now()-s.started)/1000)};if(s.mode==='exam'||s.mode==='diagnostic'||s.mode==='coverage'){progress.exams=progress.exams||[];progress.exams.push({when:Date.now(),mode:s.mode,right:score.right,total:score.total,grade:score.grade});progress.exams=progress.exams.slice(-40)}session=null;save();screen='result';viewReview=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function timeLabel(secs){let n=Math.max(0,secs);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function renderQuiz(){if(!session)return home();const s=session,st=s.steps[s.idx],q=byId[st.id],exam=['exam','diagnostic','coverage'].includes(s.mode),answered=st.answer!==-1;const done=s.steps.filter(x=>x.answer!==-1).length,miss=s.steps.filter(x=>x.answer===-1).length;const source=q.source?SOURCES[q.source]:null;const t=topicById[q.topic];const correctness=answered&&(st.answer===q.correct);let deadline=s.timed?(s.started+45*60*1000):0;const rem=Math.ceil((deadline-Date.now())/1000);if(s.timed&&rem<=0){setTimeout(finish,0)}const opts=st.order.map((ix,pos)=>{let cls=answered&&(!exam)?(ix===q.correct?'correct':ix===st.answer?'wrong':''):ix===st.answer?'selected':'';return `<button class="choice ${cls}" data-action="answer" data-pos="${pos}" ${!exam&&answered?'disabled':''} aria-label="Opção ${'ABCD'[pos]}: ${esc(q.choices[ix])}"><span class="letter">${'ABCD'[pos]}</span><span>${esc(q.choices[ix])}</span></button>`}).join('');const footer=exam?`<button class="btn outline small" data-action="prev" ${s.idx===0?'disabled':''}>← Anterior</button><button class="btn outline small" data-action="flag">${st.flag?'🚩 Retirar sinalização':'⚑ Assinalar'}</button><button class="btn dark" data-action="next">${s.idx===s.steps.length-1?'Ir ao fim da prova':'Seguinte →'}</button>`:`<button class="btn primary" data-action="next" ${!answered?'disabled':''}>${s.idx===s.steps.length-1?'Ver resultado 🏁':'Próxima pergunta →'}</button>`;return frame(`<div class="session"><div class="examtop"><div class="tagline"><span class="pill">${esc(t.icon+' '+t.name)}</span><span class="pill amber">${q.level===3?'DESAFIO':q.level===2?'INTERMÉDIO':'FUNDAMENTAL'}</span></div><div class="flex"><span class="pill">${s.idx+1} / ${s.steps.length}</span>${s.timed?`<span class="pill amber" id="countdown" role="timer">⏱ ${timeLabel(rem)}</span>`:''}</div></div><div class="progressouter" aria-label="Progresso da prova"><div class="progressinner" style="width:${pct(done,s.steps.length)}%"></div></div><div style="display:flex;justify-content:space-between;gap:10px;margin:10px 0 17px" class="tiny"><span>${done} respondida${done===1?'':'s'} · ${miss} por responder</span><span>${exam?'Sem correção até terminar':'Correção imediata'}</span></div><article class="qcard"><div class="tagline"><span class="pill" style="background:#f6f6f2">${q.source?'📜 INTERPRETAÇÃO DE FONTE':q.visual?'🖼️ LEITURA DE IMAGEM':'💭 CONHECIMENTO'}</span><span class="pill">Manual: págs. ${esc(t.pages)}</span></div>${source?`<div class="source"><strong>📜 ${esc(source.title)}</strong><p>${esc(source.text)}</p></div>`:''}${q.visual?`<figure class="illustration">${illustrations(q.visual)}<figcaption>Esquema didático simplificado (não é uma imagem do manual).</figcaption></figure>`:''}<h2 class="qtitle">${esc(q.q)}</h2><div class="choices" role="group" aria-label="Escolhe uma resposta">${opts}</div>${!exam&&answered?`<div class="feedback ${correctness?'':'no'}" aria-live="polite"><h3>${correctness?'✅ Muito bem!':'📌 Vamos perceber este erro'}</h3>${!correctness?`<p><b>Resposta correta:</b> ${esc(q.choices[q.correct])}</p>`:''}<p>${esc(q.why)}</p><button class="togglehelp" data-action="hebrew">${showHebrew?'Ocultar dica em hebraico':'🌍 Dica em hebraico'}</button>${showHebrew?`<div class="tiphe" lang="he" dir="rtl">${esc(t.he)}</div>`:''}</div>`:''}<div class="qfoot"><div>${footer}</div><button class="btn outline small" data-action="quit">Sair</button></div><p class="schoolnote">Dica: usa as teclas <kbd>1</kbd> a <kbd>4</kbd> para escolher. ${exam?'Podes alterar uma resposta antes de terminar.':'Pensa no motivo da resposta correta.'}</p></article>${exam?`<div class="numbers" aria-label="Navegar entre as perguntas">${s.steps.map((a,i)=>`<button class="num ${i===s.idx?'current':''} ${a.answer!==-1?'done':''} ${a.flag?'flagged':''}" data-action="jump" data-index="${i}" aria-label="Pergunta ${i+1}${a.answer!==-1?', respondida':''}${a.flag?', assinalada':''}">${i+1}</button>`).join('')}</div><div class="flex" style="justify-content:space-between"><span class="tiny">${s.steps.filter(x=>x.flag).length} assinaladas para rever</span><button class="btn primary" data-action="submit">Terminar e corrigir prova →</button></div>`:''}</div>`,exam?'exams':'practice')}
function result(){if(!lastResult)return home();const r=lastResult;const isExam=['exam','diagnostic','coverage'].includes(r.mode);const high=r.grade>=18;const icon=r.grade>=18?'🏆':r.grade>=14?'💪':'📚';const msg=r.grade>=18?'Excelente desempenho! Agora confirma que consegues repetir a nota.':r.grade>=14?'Estás no bom caminho. Revê os erros e tenta melhorar.':'Identifica os temas mais difíceis e volta a estudar antes de repetires a prova.';const byTopic=TOPICS.map(t=>{let items=r.steps.filter(st=>byId[st.id].topic===t.id);return{...t,total:items.length,right:items.filter(st=>st.answer===0).length}}).filter(x=>x.total);return frame(`<div class="session"><div class="resulthero"><div style="font-size:40px">${icon}</div><div class="eyebrow">${r.mode==='coverage'?'COBERTURA COMPLETA DO MANUAL':isExam?'CLASSIFICAÇÃO DO SIMULADO':'RESULTADO DO TREINO'}</div><div class="resultscore">${r.grade.toFixed(1).replace('.0','')}<small>/20</small></div><h2 style="margin:0 0 7px;font-size:23px">${r.right} de ${r.total} respostas certas</h2><p>${msg}</p><div class="tagline" style="justify-content:center"><span class="pill green">${pct(r.right,r.total)}% de acertos</span><span class="pill">${Math.floor(r.duration/60)} min de trabalho</span></div></div><section class="mainsec panel"><div class="secthead"><div><h3>Resultado por matéria</h3><p>Assim descobres exatamente o que precisas de reforçar.</p></div></div>${byTopic.map(t=>`<div class="historyrow"><span>${t.icon}</span><div style="flex:1"><strong>${esc(t.name)}</strong><div class="meter" style="margin-top:6px"><span style="width:${pct(t.right,t.total)}%"></span></div></div><b style="font-size:13px">${t.right}/${t.total}</b></div>`).join('')}<div class="btnrow" style="margin-top:18px"><button class="btn primary" data-action="review-toggle">${viewReview?'Ocultar correção':'📋 Ver todas as respostas'}</button><button class="btn dark" data-action="start" data-mode="${r.mode==='coverage'?'coverage':isExam?'exam':'smart'}">${r.mode==='coverage'?'Repetir cobertura':isExam?'Repetir prova nova':'Treinar de novo'}</button><button class="btn outline" data-action="nav" data-to="errors">Rever erros →</button></div></section>${viewReview?`<section class="mainsec"><div class="secthead"><h2>Correção detalhada</h2><span class="pill">${r.steps.length} perguntas</span></div>${r.steps.map((st,i)=>{let q=byId[st.id],ans=st.answer===-1?'Não respondida':q.choices[st.answer];return `<article class="reviewitem"><span class="pill ${st.answer===0?'green':'red'}">${st.answer===0?'CERTO':'ERRADO / NÃO RESPONDIDO'}</span><h4>${i+1}. ${esc(q.q)}</h4><p><b>A tua resposta:</b> <span class="${st.answer===0?'good':'bad'}">${esc(ans)}</span></p>${st.answer!==0?`<p><b>Correta:</b> <span class="good">${esc(q.choices[0])}</span></p>`:''}<details><summary>Explicação e motivo</summary><p>${esc(q.why)}</p></details></article>`}).join('')}</section>`:''}<div class="mainsec" style="text-align:center"><button class="btn outline" data-action="nav" data-to="home">← Voltar ao início</button></div></div>`,isExam?'exams':'practice')}
function render(){const target=$('app');let html=screen==='study'?study():screen==='practice'?practiceSetup():screen==='exams'?exams():screen==='errors'?errorsPage():screen==='quiz'?renderQuiz():screen==='result'?result():home();target.innerHTML=html;clearInterval(timerId);if(screen==='quiz'&&session&&session.timed){timerId=setInterval(()=>{if(!session||screen!=='quiz'){clearInterval(timerId);return}const r=Math.ceil((session.started+45*60*1000-Date.now())/1000),el=$('countdown');if(el)el.textContent='⏱ '+timeLabel(r);if(r<=0)finish()},1000)}}
function doNext(){if(!session)return;const s=session;const exam=['exam','diagnostic','coverage'].includes(s.mode);if(!exam&&s.steps[s.idx].answer===-1)return;if(s.idx===s.steps.length-1){if(exam){const left=s.steps.filter(x=>x.answer===-1).length;if(left>0){let move=s.steps.findIndex(x=>x.answer===-1);s.idx=move;save();render();return}if(confirm('Terminaste a prova. Queres corrigir as respostas agora?'))finish();}else finish()}else{s.idx++;showHebrew=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}}
function submit(){if(!session)return;const n=session.steps.filter(x=>x.answer===-1).length;let msg=n?`Ainda tens ${n} pergunta${n===1?'':'s'} por responder. As que faltam contam como erradas. Queres entregar a prova?`:'Queres entregar a prova e ver a tua classificação?';if(confirm(msg))finish()}
function handle(action,b){if(action==='nav'){const to=b.dataset.to;if(session&&screen==='quiz'){if(!confirm('Sair da sessão atual? O progresso desta sessão será perdido.'))return;session=null;save()}screen=to;render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='study-topic'){studyTopic=b.dataset.topic;screen='study';showHebrew=false;render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='start'){if(session&&screen==='quiz'&&!confirm('Começar outra sessão? A atual será abandonada.'))return;let mode=b.dataset.mode,topic=b.dataset.topic||null;if(mode==='topic-select')mode='topic',topic=$('topic-select')?.value||'politica';if(mode==='mistake-topic')mode='mistake-topic';if(mode==='exam'){examTimed=$('timed-check')?.checked??examTimed}begin(mode,topic);return}
 if(action==='hebrew'){showHebrew=!showHebrew;render();return}
 if(action==='flip'){let i=+b.dataset.index;if(glossaryOpen.has(i))glossaryOpen.delete(i);else glossaryOpen.add(i);render();return}
 if(action==='answer'&&session){let st=session.steps[session.idx],exam=['exam','diagnostic','coverage'].includes(session.mode);if(!exam&&st.answer!==-1)return;let pos=+b.dataset.pos;st.answer=st.order[pos];if(!exam){st.logged=true;logAnswer(byId[st.id],st.answer);sound(st.answer===0)}save();render();return}
 if(action==='next'){doNext();return}
 if(action==='prev'&&session&&session.idx>0){session.idx--;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='jump'&&session){session.idx=+b.dataset.index;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='flag'&&session){session.steps[session.idx].flag=!session.steps[session.idx].flag;save();render();return}
 if(action==='submit'){submit();return}
 if(action==='quit'){if(confirm('Queres sair desta sessão? As respostas já registadas nos treinos ficam guardadas.')){session=null;save();screen='home';render();window.scrollTo({top:0,behavior:'smooth'})}return}
 if(action==='review-toggle'){viewReview=!viewReview;render();if(viewReview)window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='print'){window.print();return}
 if(action==='export'){let txt=JSON.stringify({version:3,exportedAt:new Date().toISOString(),progress},null,2),blob=new Blob([txt],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='missao-atenas-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
 if(action==='import'){$('import-file')?.click();return}
 if(action==='reset'){if(confirm('Tens a certeza? Vais apagar todas as estatísticas e notas guardadas neste navegador.')){progress={q:{},exams:[],xp:0};session=null;save();render()}return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;handle(b.dataset.action,b)});
document.addEventListener('change',e=>{if(e.target.id==='topic-select')practiceTopic=e.target.value;if(e.target.id==='timed-check')examTimed=e.target.checked;if(e.target.id==='import-file'){const f=e.target.files?.[0];if(!f)return;const rdr=new FileReader();rdr.onload=()=>{try{let d=JSON.parse(rdr.result);if(!d.progress||typeof d.progress.q!=='object'||!Array.isArray(d.progress.exams))throw new Error('Ficheiro inválido');if(!confirm('Substituir o progresso guardado neste navegador pelos dados do ficheiro?'))return;progress=d.progress;session=null;screen='home';save();render();alert('Progresso importado com sucesso.')}catch(err){alert('Não foi possível importar: '+err.message)}};rdr.readAsText(f)}});
document.addEventListener('keydown',e=>{if(screen!=='quiz'||!session||e.altKey||e.ctrlKey||e.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();let b=document.querySelector(`[data-action="answer"][data-pos="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}else if(e.key==='ArrowRight'&&['exam','diagnostic','coverage'].includes(session.mode)){e.preventDefault();doNext()}else if(e.key==='ArrowLeft'&&session.idx>0&&['exam','diagnostic','coverage'].includes(session.mode)){e.preventDefault();handle('prev',document.createElement('button'))}else if(e.key==='Enter'&&!['exam','diagnostic','coverage'].includes(session.mode)&&session.steps[session.idx].answer!==-1){e.preventDefault();doNext()}});
load();render();
</script>
