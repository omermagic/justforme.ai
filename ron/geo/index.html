        margin-top: 16px;
      }
      h2 {

      }
      h3 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }
      p {
        margin: 9px 0 14px;
      }
      .muted {

      }

        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .tile {
        background: #f4f5ff;
        border: 1px solid #dadcf8;
        border-radius: 13px;
        padding: 15px;
      }
      .tile strong {
        font-size: 1.35rem;
        display: block;
      }
      .tile small {
        display: block;
        color: var(--muted);
      }
      .select-label {
        font-size: 0.85rem;
        font-weight: 750;
        margin: 18px 0 7px;
        display: block;
      }
      .modes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;

      .mode {
        border-radius: 13px;
        border: 2px solid var(--border);
        background: #fff;
        padding: 13px;
        text-align: left;
        transition:
          background 0.15s,
          border-color 0.15s;
        min-height: 75px;
      }
      .mode b {
        display: block;
      }
      .mode small {
        color: var(--muted);
        display: block;
        line-height: 1.3;
        margin-top: 3px;

      .mode.selected {
        border-color: var(--purple);
        background: #f6f1ff;
      }
      .select-wrap {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        background: #fff;
        color: var(--ink);

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: 11px;
        border: 0;
        padding: 13px 21px;
        font-weight: 800;
        background: var(--blue);
        color: white;

      .button:hover {
        filter: brightness(1.08);
      }
      .button.secondary {
        color: var(--blue);
        background: #e9edff;
      }
      .button.ghost {
        background: white;
        color: var(--blue);
        border: 1px solid #cdd5f1;
      }

        background: #feecef;
        color: #a82d40;

        flex-wrap: wrap;
        margin-top: 18px;

      .tiny {

        border-radius: 8px;
        margin-top: 14px;

      .stats-header {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      .progress {
        height: 10px;
        background: #e8ecf6;
        overflow: hidden;
        border-radius: 100px;
        margin: 14px 0 8px;
      }
      .progress-inner {
        height: 100%;
        background: linear-gradient(90deg, #3256bb, #9a5be1);
        transition: width 0.2s;
      }
      .question {
        font-size: clamp(1.23rem, 4vw, 1.68rem);
        line-height: 1.35;
        font-weight: 800;
        margin: 18px 0 19px;
      }
      .choices {
        display: grid;
        gap: 11px;
      }
      .choice {
        display: flex;
        width: 100%;
        align-items: flex-start;
        text-align: left;
        border: 2px solid var(--border);
        background: #fff;
        border-radius: 12px;
        padding: 14px;
        gap: 12px;
        min-height: 62px;
        color: var(--ink);
      }
      .choice:hover:not(:disabled) {
        border-color: #9da7ec;
        background: #f7f7ff;
      }
      .choice .letter {
        display: flex;
        flex: 0 0 29px;
        width: 29px;
        height: 29px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #eef0fc;
        font-weight: 800;
        color: var(--blue);
      }
      .choice.correct {
        border-color: #3aa177;
        background: #eafbf3;
      }
      .choice.incorrect {
        border-color: #d45260;
        background: #fff0f2;
      }
      .choice.picked {
        border-color: var(--blue);
        background: #f0f2ff;
      }
      .choice:disabled {
        cursor: default;
      }
      .feedback {
        border-radius: 12px;
        padding: 15px;
        margin-top: 18px;
      }
      .feedback.good {
        background: #e9faf0;
        border: 1px solid #9fdfba;
        color: #155937;
      }
      .feedback.bad {
        background: #fff0f1;
        border: 1px solid #f2adb5;
        color: #8e2938;
      }
      .feedback strong {
        font-size: 1.03rem;
      }
      .feedback p {
        margin: 7px 0 0;
      }
      .tag {
        border-radius: 100px;
        background: #edf1fb;
        padding: 5px 10px;
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 750;
        color: #485b89;
      }
      .scorebig {

        line-height: 1.05;
        font-weight: 900;
        letter-spacing: -0.06em;
      }
      .grade {
        font-size: 1.5rem;
        font-weight: 850;
        color: var(--blue);
      }
      .review {
        border-top: 1px solid var(--border);
        padding: 15px 0;
      }
      .review:last-child {
        padding-bottom: 0;
      }
      .review p {
        margin: 4px 0;
        font-size: 0.94rem;
      }
      .ok {
        color: var(--green);
      }
      .no {
        color: var(--red);
      }
      .guide {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }
      .note {
        border: 1px solid var(--border);
        padding: 18px;
        border-radius: 13px;
        background: #fff;
      }
      .note ul {
        margin: 8px 0 2px;
        padding-left: 21px;
      }
      .note li + li {
        margin-top: 4px;
      }
      .barrow {
        display: grid;
        grid-template-columns: 1fr 58px;
        gap: 8px;
        margin-top: 13px;
      }
      .barrow .topic {
        font-size: 0.87rem;
        font-weight: 720;
      }
      .bar {
        height: 9px;
        border-radius: 20px;
        background: #e8ebf6;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar div {
        height: 100%;
        background: var(--purple);
      }
      .compass {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px auto 16px;
      }
      .compass svg {
        max-width: 100%;
        max-height: 190px;
      }
      .foot {
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 18px;
      }
      .pill {
        display: inline-block;
        background: #f1eaff;
        color: #5736ab;
        border-radius: 30px;
        padding: 5px 11px;
        font-size: 0.83rem;
        font-weight: 750;
      }
      .hidden {
        display: none !important;
      }
      /* Responsive and print layouts */
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .modes,
        .guide {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 490px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .modes,
        .guide {
          grid-template-columns: 1fr;
        }
        header {
          padding: 24px 18px;
        }
        main {
          padding: 15px 12px 70px;
        }
        .choice {
          padding: 12px 10px;
        }
        .tile {
          padding: 11px;
        }
      }
      @media print {
        header nav,
        .buttonbar,
        .modes {
          display: none !important;
        }
        body {
          background: white;
        }
        .panel {
          box-shadow: none;
        }
      }

      .hero-label {
        letter-spacing: 0.06em;
      }
      .shareline {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 14px;
      }
      .shareline .tiny {
        flex: 1;
        min-width: 220px;
      }
      .topiccount {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .readytag {
        font-weight: 800;
      }
      .choice:disabled {
        cursor: default;
      }
      .kbd {
        display: inline-block;
        border: 1px solid #cbd5ea;
        border-radius: 5px;
        padding: 0 5px;
        font-size: 0.82rem;
        background: #f2f5fc;
        color: #43516d;
      }
    </style>

            let changed = false;
            for (let g of groups) {

        state.answers[state.index] = i;
        state.revealed = !examMode();
        renderQuiz();
      }
      function nextQuestion() {
        if (state.index === state.test.length - 1) {
          finishTest();
        } else {
          state.index++;
          state.revealed = false;
          renderQuiz();
        }
      }
      // Active-question view.
      function renderQuiz() {
        let q = state.test[state.index];
        if (!q) return;
        const given = state.answers[state.index];
        const answered = given !== null;
        const reveal = state.revealed;
        let score = state.answers
          .slice(0, state.index + (answered ? 1 : 0))
          .reduce((sum, a, i) => sum + (a !== null && state.test[i].choices[a].correct ? 1 : 0), 0);
        APP.innerHTML = `<div class="panel"><div class="stats-header"><div><span class="tag">${escapeHtml(q.topic)}</span><p class="muted" style="margin:9px 0 0">Pergunta <b>${state.index + 1}</b> de ${state.test.length} ${examMode() ? "· Simulação" : "· Treino"}</p></div><div class="tiny">⏱ <span id="clock">${timerText()}</span>${!examMode() ? ` · ✅ ${score} certas até agora` : ""}</div></div><div class="progress"><div class="progress-inner" style="width:${((state.index + 1) / state.test.length) * 100}%"></div></div>
<div class="question">${escapeHtml(q.q)}</div>${q.topic === "Rosa dos ventos e direções" ? compassHTML() : ""}
<div class="choices">${q.choices
          .map((c, i) => {
            let cls = reveal
              ? c.correct
                ? "correct"
                : given === i
                  ? "incorrect"
                  : ""
              : given === i
                ? "picked"
                : "";
            return `<button class="choice ${cls}" data-choice="${i}" ${reveal ? "disabled" : ""}><span class="letter">${"ABCD"[i]}</span><span>${escapeHtml(c.text)}</span></button>`;
          })
          .join("")}</div>
${reveal ? `<div class="feedback ${q.choices[given].correct ? "good" : "bad"}"><strong>${q.choices[given].correct ? "✓ Correto!" : "✗ Ainda não. Resposta certa: " + escapeHtml(q.choices.find((c) => c.correct).text)}</strong><p>${escapeHtml(q.explanation)}</p></div>` : ""}
<div class="buttonbar"><button id="next" class="button" ${!answered ? "disabled" : ""}>${state.index === state.test.length - 1 ? "Terminar e ver o resultado →" : "Pergunta seguinte →"}</button><button id="exit" class="button ghost">Sair do teste</button></div><p class="tiny">${examMode() ? "Numa simulação, as respostas só são corrigidas no fim." : "Neste treino, a explicação aparece logo após responder."} ${!answered ? "Escolhe A, B, C ou D." : ""}</p></div>`;
        APP.querySelectorAll("[data-choice]").forEach(
          (b) =>
            (b.onclick = () => {
              if (!reveal) selectAnswer(Number(b.dataset.choice));
            }),
        );
        document.getElementById("next").onclick = nextQuestion;
        document.getElementById("exit").onclick = () => {
          if (confirm("Queres sair? As respostas deste teste não serão guardadas."))
            switchView("home");
        };
      }
      // Saves results after the final answer.
      function finishTest() {
        clearInterval(state.clock);
        state.clock = null;
        state.test.forEach((q, i) => {
          let chosen = state.answers[i],
            s = getStats(q.id);
          if (chosen === null) return;
          s.total++;
          if (q.choices[chosen].correct) s.correct++;
          progress.stats[q.id] = s;
          progress.questionsAnswered++;
        });
        const correct = state.answers.reduce(
          (n, a, i) => n + (a !== null && state.test[i].choices[a].correct ? 1 : 0),
          0,
        );
        const score = Math.round((correct / state.test.length) * 100);
        progress.completed++;
        if (examMode() && score >= 90) progress.aTests++;
        save();
        state.view = "results";
        render();
      }
      function grade(score) {
        return score >= 90
          ? "Excelente"
          : score >= 80
            ? "Muito bom"
            : score >= 70
              ? "Bom"
              : score >= 50
                ? "A melhorar"
                : "Continua a treinar";
      }
      // Results and detailed answer review.
      function renderResults() {
        let total = state.test.length;
        let good = state.answers.reduce(
          (n, a, i) => n + (a !== null && state.test[i].choices[a].correct ? 1 : 0),
          0,
        );
        let percent = Math.round((good / total) * 100);
        const mistakes = total - good;
        const verdict =
          percent >= 90
            ? "Excelente! Atingiste o objetivo de 90% neste treino."
            : percent >= 80
              ? "Quase nos 90%! Revê as perguntas falhadas e tenta novamente."
              : "Cada erro é uma oportunidade de aprender. Revê as explicações e continua!";
        APP.innerHTML = `<div class="panel"><span class="pill">Teste concluído · ${timerText()}</span><h2 style="margin-top:15px">Resultado — Geografia 7.º D</h2><div class="scorebig">${percent}%</div><div class="grade">${grade(percent)}</div><p><b>${good}/${total}</b> respostas certas · <b>${mistakes}</b> por rever</p><p>${verdict}</p><div class="buttonbar"><button class="button" id="again">Fazer outro teste →</button><button class="button secondary" id="weakagain">Treinar as perguntas erradas</button><button class="button ghost" id="studybtn">Resumo da matéria</button></div></div><div class="panel"><h2>Correção das respostas</h2>${state.test
          .map((q, i) => {
            let a = state.answers[i],
              isCorrect = a !== null && q.choices[a].correct;
            return `<div class="review"><div class="tiny">${escapeHtml(q.topic)} · Pergunta ${i + 1} <strong class="${isCorrect ? "ok" : "no"}">${isCorrect ? "✓ Correta" : "✗ Incorreta"}</strong></div><strong>${escapeHtml(q.q)}</strong><p>Respondeste: <span class="${isCorrect ? "ok" : "no"}">${a === null ? "Sem resposta" : escapeHtml(q.choices[a].text)}</span></p>${!isCorrect ? `<p>Resposta certa: <b class="ok">${escapeHtml(q.choices.find((c) => c.correct).text)}</b></p>` : ""}<p class="muted">${escapeHtml(q.explanation)}</p></div>`;
          })
          .join("")}</div>`;
        document.getElementById("again").onclick = () => switchView("home");
        document.getElementById("weakagain").onclick = () => {
          state.mode = "weak";
          state.topic = "all";
          switchView("home");
        };
        document.getElementById("studybtn").onclick = () => switchView("guide");
      }
      // Small inline illustration used for direction questions.
      function compassHTML() {
        return `<div class="compass" aria-label="Rosa dos ventos: norte em cima, este à direita, sul em baixo e oeste à esquerda"><svg viewBox="0 0 180 160" role="img"><circle cx="90" cy="80" r="57" fill="#f8f9ff" stroke="#e1e5fa" stroke-width="2"/><path d="M90 36L98 72L133 80L98 88L90 124L82 88L47 80L82 72Z" fill="#f5bdd4" stroke="#5740af" stroke-width="1.5"/><path d="M90 36L90 124M47 80L133 80" stroke="#5740af"/><circle cx="90" cy="80" r="6" fill="#5740af"/><g text-anchor="middle" font-size="14" font-weight="bold" fill="#283c91"><text x="90" y="18">N</text><text x="90" y="150">S</text><text x="155" y="84">E</text><text x="25" y="84">O</text></g></svg></div>`;
      }
      function htmlEmphasis(line) {
        return escapeHtml(line)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>");
      }
      // Study guide.
      function renderGuide() {
        APP.innerHTML = `<div class="panel"><h2>📚 Resumo de Geografia — 7.º D</h2><p class="muted">Matéria baseada nas páginas 14–33 do manual fotografado. Lê o resumo e depois faz testes sobre os temas em que sentes mais dificuldades.</p></div><div class="guide" style="margin-top:14px">${NOTES.map(([title, lines]) => `<article class="note"><h3>${escapeHtml(title)}</h3><ul>${lines.map((x) => `<li>${htmlEmphasis(x)}</li>`).join("")}</ul></article>`).join("")}</div><div class="buttonbar"><button id="guide-go" class="button">Vamos praticar →</button></div>`;
        document.getElementById("guide-go").onclick = () => switchView("home");
      }
      // Progress dashboard.
      function renderStats() {
        const s = totalStats();
        APP.innerHTML = `<div class="panel"><h2>📈 O meu progresso</h2><div class="grid"><div class="tile"><strong>${progress.completed}</strong><small>Testes concluídos</small></div><div class="tile"><strong>${progress.questionsAnswered}</strong><small>Respostas dadas</small></div><div class="tile"><strong>${progress.aTests}</strong><small>Simulações com 90% ou mais</small></div></div><p class="muted">Taxa de acerto: <b>${s.total ? Math.round((100 * s.correct) / s.total) + "%" : "Ainda sem respostas"}</b>. O objetivo de treino não corresponde necessariamente à classificação utilizada pelo professor.</p><h3>Resultados por tema</h3>${TOPICS.map(
          (t) => {
            let x = topicStats(t);
            let pct = x.total ? Math.round((100 * x.correct) / x.total) : 0;
            return `<div class="barrow"><div><div class="topic">${escapeHtml(t)}</div><div class="bar"><div style="width:${pct}%"></div></div></div><div style="text-align:right;font-weight:750">${x.total ? pct + "%" : "—"}</div></div>`;
          },
        ).join(
          "",
        )}<div class="buttonbar"><button id="stats-weak" class="button">Rever perguntas erradas →</button><button id="reset" class="button danger">Apagar progresso</button></div></div>`;
        document.getElementById("stats-weak").onclick = () => {
          state.mode = "weak";
          state.topic = "all";
          switchView("home");
        };
        document.getElementById("reset").onclick = () => {
          if (confirm("Queres apagar todos os resultados guardados neste navegador?")) {
            progress.stats = {};
            progress.completed = 0;
            progress.aTests = 0;
            progress.questionsAnswered = 0;
            save();
            renderStats();
          }
        };
      }
      // Central view router.
      function render() {
        if (state.view === "home") renderHome();
        if (state.view === "quiz") renderQuiz();
        if (state.view === "results") renderResults();
        if (state.view === "guide") renderGuide();
        if (state.view === "stats") renderStats();
      }
      document.addEventListener("keydown", (e) => {
        if (
          state.view !== "quiz" ||
          !["1", "2", "3", "4", "Enter"].includes(e.key) ||
          e.altKey ||
          e.ctrlKey
        )
          return;
        if (["1", "2", "3", "4"].includes(e.key) && !state.revealed) {
          selectAnswer(Number(e.key) - 1);
        } else if (e.key === "Enter" && state.answers[state.index] !== null) nextQuestion();
      });
      render();
    </script>
  </body>
</html>
