function chooseWord(){

function chooseClozeWord(){

  if(state){if(!state.retiredEasy&&Number.isFinite(state.due)&&state.due<=now)due.push(word)}else fresh.push(word);
 }
 const source=due.length?due:fresh;
 if(!source.length)return null;

function shuffled(items){let result=[...items];for(let i=result.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}

  const nearby=bank.filter(other=>other.id!==w.id&&other.pos===w.pos&&norm(other.pt)!==norm(w.pt)).sort((a,b)=>Math.abs(a.rank-w.rank)-Math.abs(b.rank-w.rank));
