 let cands=bank.filter(o=>o.id!==w.id&&o.pos===w.pos&&Math.abs(o.rank-w.rank)<1800&&norm(o.pt)!==norm(w.pt)&&norm(primaryMeaning(o.en))!==norm(primaryMeaning(w.en)));if(cands.length<3)cands=bank.filter(o=>o.id!==w.id&&norm(primaryMeaning(o.en))!==norm(primaryMeaning(w.en)));let options=[answers],seen=new Set([norm(answers)]),lim=0;while(options.length<4&&lim++<150){let o=cands[Math.floor(Math.random()*cands.length)];if(!o)break;let t=direction==='reverse'?o.pt:primaryMeaning(o.en);if(t&&!seen.has(norm(t))){options.push(t);seen.add(norm(t))}}if(options.length<4)kind='type',direction='reverse',prompt=primaryMeaning(w.en),answers=w.pt;
 options.sort(()=>Math.random()-.5);return{w,direction,kind,answer:answers,prompt,options,locked:false,started:Date.now()}}
function startSession(mode){clearTimeout(feedbackTimeout);stopSessionClock();session={mode,remaining:180,accountedSeconds:0,masteredAtStart:metrics().known,questions:0,right:0,combo:0,newIds:new Set(),wrongIds:new Set(),seenIds:new Set(),retryQueue:[],retryCounts:new Map(),current:null,paused:false,levelAtStart:estimatedSkillRank()};view='game';nextQuestion();intervalHandle=setInterval(tick,140)}
let lastFrame=0;function tick(){if(!session||view!=='game')return;let t=performance.now();if(!lastFrame){lastFrame=t;return}if(document.hidden||session.paused){lastFrame=t;return}let dt=Math.min(.5,(t-lastFrame)/1000);lastFrame=t;session.remaining-=dt;recordSessionTime();if(session.remaining<=0){session.remaining=0;finishSession();return}let el=document.querySelector('#clock'),bar=document.querySelector('#timeFill');if(el)el.textContent=timerText(session.remaining);if(bar)bar.style.width=(100*session.remaining/180).toFixed(2)+'%'}function timerText(s){return `${Math.floor(s/60)}:${String(Math.ceil(s)%60).padStart(2,'0')}`}
function stopSessionClock(){clearInterval(intervalHandle);intervalHandle=null;lastFrame=0;try{window.speechSynthesis?.cancel()}catch{}}
function recordSessionTime(force=false){
 if(!session)return;
 const elapsed=Math.max(0,Math.floor(180-session.remaining)),delta=elapsed-(session.accountedSeconds||0);
 if(delta<=0||(!force&&delta<5))return;
 const p=player();p.totalSeconds=(Number(p.totalSeconds)||0)+delta;session.accountedSeconds=elapsed;saveUsers();
}
function nextQuestion(){if(!session)return;if(session.remaining<=0)return finishSession();let w=chooseWord();if(!w)return finishSession();session.current=makeQuestion(w);game()}
function game(){if(!session)return view='home',render();let s=session,q=s.current,w=q?.w;if(!q)return;let label=q.kind==='type'?'SPELL IT IN PORTUGUESE':q.direction==='reverse'?'ENGLISH → PORTUGUESE':'PORTUGUESE → ENGLISH';shell(`<main class="game-shell"><div class="game-head"><button class="btn btn-ghost btn-small" id="exitSession">← End run</button><div class="game-metrics"><div class="metric clock"><small>⏱</small><span id="clock">${timerText(s.remaining)}</span></div><div class="metric combo"><small>🔥</small><span id="combo">${s.combo} combo</span></div><div class="metric"><small>🧠</small><span id="mastered">${metrics().known} mastered</span></div></div></div><div class="track"><div class="fill" id="timeFill" style="width:${100*s.remaining/180}%"></div></div><div class="question"><div class="question-top"><span class="qtype">${label}</span><span class="rank">WORD ${w.rank.toLocaleString()} · ${safe(w.pos)}</span></div><div class="word">${safe(q.prompt)}</div><div class="word-sub">${q.kind==='type'?'Type the Portuguese word or phrase':q.direction==='reverse'?'Which Portuguese word matches?':'What does this mean in English?'}</div><button class="listen" id="listenBtn" title="Play European Portuguese pronunciation">${q.direction==='forward'?'🔊 Hear again':'🔊 Hear Portuguese (hint)'}</button>${q.kind==='choice'?`<div class="choices">${q.options.map((o,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${safe(o)}</span></button>`).join('')}</div><div style="text-align:center;margin-top:14px"><button class="btn btn-outline btn-small" id="dontKnowChoice">🤷 I don't know yet</button></div>`:`<div class="type-wrap"><input autocomplete="off" autocapitalize="off" spellcheck="false" class="type-input" id="typedAnswer" placeholder="Write the Portuguese answer" aria-label="Answer"><div class="type-actions"><button class="btn btn-primary" id="submitTyped">Check answer ↗</button><button class="btn btn-ghost" id="dontKnow">Not sure</button></div></div>`}<div class="feedback hidden" id="feedback" role="status"></div><div class="tip" id="tipLine">${session.mode==='sprint'?'Choose quickly to build a combo!':'Wrong answers are not failures: they teach the scheduler what to bring back.'}</div></div><div class="backline"><span>${s.questions} answers this run · ${s.newIds.size} new words</span><span>🇵🇹 Offline-friendly</span></div></main>`);
 document.querySelector('#exitSession').onclick=()=>{if(confirm('End your run early? Your answered words are already saved.'))finishSession()};document.querySelector('#listenBtn').onclick=()=>speakPortuguese(w.pt);
 if(q.kind==='choice'){document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>answer(q.options[Number(btn.dataset.choice)],btn));document.querySelector('#dontKnowChoice').onclick=()=>answer('',null,true)}else{let input=document.querySelector('#typedAnswer');document.querySelector('#submitTyped').onclick=()=>answer(input.value.trim(),null);document.querySelector('#dontKnow').onclick=()=>answer('',null,true);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();answer(input.value.trim(),null)}};setTimeout(()=>{if(view==='game'&&!q.locked)input.focus({preventScroll:true})},70)}
 // Portuguese-to-English: pronounce the prompt on arrival. English-to-Portuguese:
 // wait until the answer so speech does not give away the recall challenge.
 if(prefs.sound&&q.direction==='forward')speakPortuguese(w.pt,true);
}
function speakPortuguese(word,automatic=false){if(!('speechSynthesis'in window)){if(!automatic)notify('Speech is unavailable on this browser.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='pt-PT';u.rate=.84;let voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang.toLowerCase()==='pt-pt')||voices.find(v=>v.lang.toLowerCase().startsWith('pt'));if(voice)u.voice=voice;speechSynthesis.speak(u)}catch{if(!automatic)notify('Could not start speech playback.')}}
function beep(correct){if(!prefs.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(correct?590:210,t);o.frequency.exponentialRampToValueAtTime(correct?940:170,t+.11);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2)}catch{}}
// Confident answers to words far below the current range retire those words.
// Other correct answers use long, expanding review intervals.
function answer(given,clicked,skipped=false){
 if(!session||view!=='game')return;
 const s=session,q=s.current;
 // An empty typed submission is ignored, but the explicit "Not sure" action
 // must be graded as a miss so the answer is revealed and scheduled again.
 if(q.locked||q.kind==='type'&&!given&&!skipped)return;
 const right=norm(given)===norm(q.answer),now=Date.now(),p=player(),skillBefore=estimatedSkillRank(p),responseMs=now-q.started;
 const prior=p.words[q.w.id]||{seen:0,right:0,wrong:0,streak:0,interval:0,ease:2.2,due:0};
 const newWord=prior.seen===0,wasMastered=isMastered(prior);
 q.locked=true;clearTimeout(feedbackTimeout);beep(right);s.questions++;prior.seen++;
 if(newWord)s.newIds.add(q.w.id);
 let reviewNote='';
 if(right){
  s.right++;s.combo++;prior.right++;
  const clearlyEasy=(prior.wrong||0)===0&&isClearlyKnown(q.w,skillBefore,responseMs,q.kind);
  if(clearlyEasy){
   prior.retiredEasy=true;prior.streak=Math.max(MASTERY_STREAK,prior.streak+1);prior.verifiedDays=Math.max(MASTERY_STREAK,prior.verifiedDays||0);prior.interval=3650;prior.due=now+3650*DAY;
   reviewNote='Easy for you — retired from future missions.';
  }else{
   prior.retiredEasy=false;prior.streak++;prior.ease=Math.min(3,Math.max(1.45,prior.ease+.04));
   if(prior.lastCorrectDay!==dayKey()){prior.verifiedDays=(prior.verifiedDays||0)+1;prior.lastCorrectDay=dayKey()}
   const days=prior.streak===1?4:prior.streak===2?14:prior.streak===3?45:Math.min(365,Math.max(75,prior.interval*2.2));
   prior.interval=days;prior.due=now+days*DAY;reviewNote=`Next review in ${Math.round(days)} days.`;
  }
 }else{
  s.combo=0;prior.wrong++;prior.retiredEasy=false;prior.streak=0;prior.verifiedDays=0;prior.lastCorrectDay='';prior.ease=Math.max(1.3,prior.ease-.18);prior.interval=0;prior.due=now;s.wrongIds.add(q.w.id);queueFailedWord(s,q.w.id);
  reviewNote='Coming back after a few other words.';
 }
 const newSkill=updateSkillEstimate(p,q.w,right);
 reviewNote+=` Level: ${skillBand(newSkill,p.skillAnswers)} · range ${newSkill}.`;
 const newlyMastered=!wasMastered&&isMastered(prior);
 prior.last=now;p.words[q.w.id]=prior;let dk=dayKey();p.hist=p.hist||{};p.hist[dk]=p.hist[dk]||{questions:0,right:0};p.hist[dk].questions++;if(right)p.hist[dk].right++;saveUsers();
 // On reverse/typing questions, automatically read the Portuguese answer after grading.
 if(prefs.sound&&q.direction==='reverse')speakPortuguese(q.w.pt,true);
 const listenBtn=document.querySelector('#listenBtn');if(listenBtn)listenBtn.textContent='🔊 Hear again';
 if(q.kind==='choice'){document.querySelector('#dontKnowChoice')?.setAttribute('disabled','');document.querySelectorAll('[data-choice]').forEach((el)=>{el.disabled=true;let t=q.options[Number(el.dataset.choice)];if(norm(t)===norm(q.answer))el.classList.add('correct');else if(el===clicked)el.classList.add('wrong');else el.classList.add('muted')})}else{document.querySelector('#typedAnswer')?.setAttribute('disabled','');document.querySelector('#submitTyped')?.setAttribute('disabled','');document.querySelector('#dontKnow')?.setAttribute('disabled','')}
 let f=document.querySelector('#feedback');let display=`<div><strong>${right?(newlyMastered?'✨ Word mastered!':'✨ Nailed it!'):`💡 ${safe(q.w.pt)} = ${safe(primaryMeaning(q.w.en))}`}</strong>${right?`${safe(q.w.pt)} = ${safe(primaryMeaning(q.w.en))}`:`Remember: ${safe(q.w.pt)} means ${safe(primaryMeaning(q.w.en))}.`}<br><small>${safe(reviewNote)}</small></div><div class="ficon">${right?'✅':'🧩'}</div>`;f.innerHTML=display;f.classList.remove('hidden');f.classList.add(right?'good':'bad');document.querySelector('#combo').textContent=s.combo+' combo';document.querySelector('#mastered').textContent=metrics(p).known+' mastered';
 feedbackTimeout=setTimeout(()=>{if(session===s&&view==='game')nextQuestion()},right?920:1800)}
function finishSession(){if(!session)return;clearTimeout(feedbackTimeout);recordSessionTime(true);stopSessionClock();view='result';render()}
function result(){let s=session,m=metrics(),accuracy=s.questions?Math.round(100*s.right/s.questions):0,elapsed=Math.min(180,Math.max(0,180-s.remaining)),masteredThisRun=Math.max(0,m.known-s.masteredAtStart);let heading=s.questions===0?'Adventure paused':accuracy>=85?'Brilliant run!':accuracy>=60?"You're building momentum!":'Every word is progress!';shell(`<main class="center-panel"><div class="big-emoji">${accuracy>=85&&s.questions?'🏆':accuracy>=60?'🚀':'🧭'}</div><div class="eyebrow">THREE-MINUTE QUEST COMPLETE</div><h1>${heading}</h1><p>Your vocabulary map just got smarter. Missed words will return sooner; known words will wait until you need them again.</p><div class="result-grid"><div class="result-stat"><b>${formatSessionTime(elapsed)}</b><span>PRACTISED</span></div><div class="result-stat"><b>${s.right}/${s.questions}</b><span>CORRECT</span></div><div class="result-stat"><b>${masteredThisRun}</b><span>MASTERED</span></div></div><div class="info" style="text-align:left"><b>🧠 Learning progress</b><br>${s.wrongIds.size} tricky word${s.wrongIds.size===1?'':'s'} queued for extra practice · ${m.known} words mastered overall · ${formatStudyTime(m.totalSeconds)} total active practice</div><div style="display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:25px"><button id="playAgain" class="btn btn-primary">⚡ One more mission</button><button id="backHome" class="btn btn-ghost">Dashboard</button></div></main>`);document.querySelector('#playAgain').onclick=()=>startSession(s.mode);document.querySelector('#backHome').onclick=()=>{session=null;view='home';render()}}
/* Lifecycle: progress saved on EVERY answer, clock pauses if backgrounded. */
document.addEventListener('visibilitychange',()=>{if(document.hidden)recordSessionTime(true);lastFrame=0});window.addEventListener('pagehide',()=>{recordSessionTime(true);saveUsers()});window.addEventListener('keydown',e=>{if(view==='game'&&session?.current?.kind==='choice'&&!session.current.locked&&['1','2','3','4'].includes(e.key)){let el=document.querySelectorAll('[data-choice]')[Number(e.key)-1];if(el)el.click()}});
render();if(!bankFull&&navigator.onLine!==false)fetchBank();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
